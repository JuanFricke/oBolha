[project]
name = "obolha"
version = "0.1.0"
description = "AI-powered video clip extractor — cuts the best moments automatically"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.13",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "yt-dlp>=2026.7.4",
    "httpx>=0.27",
]

[project.scripts]
obolha = "obolha:main"
obolha-web = "webui:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
filter = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "moviepy>=1.0",
    "tqdm>=4.66",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["obolha.py", "webui.py", "youtube_schedule.py", "postiz.py", "jaguar_sepia_filter.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
