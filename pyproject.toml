[project]
name = "obolha"
version = "0.1.0"
description = "AI-powered video clip extractor — cuts the best moments automatically"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.13",
    "faster-whisper>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.1",
]

[project.scripts]
obolha = "obolha:main"

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.uv]
dev-dependencies = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
